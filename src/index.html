	<!-- Tour Guide Component Template -->
	<script id="tour-template" type="text/x-handlebars-template">
		<div class="col-sm-12" id="docket-observation-one"></div>
		<div id="docket-step-one" class="single-step"> 
			<span class="connectorarrow-tm"></span>
			<p>According to the agreement between the patent seller and SynPat, the ownership of the patents will transfer to SynPat as soon as the Upfront Price is paid to the seller.</p>
			<footer>
				<a href="#" class="btn-default pull-right" data-powertour-action="stop" onclick="cancelDocketTour();">End</a>
				<a href="#" class="tour-button" data-powertour-action="next">Next</a>
			</footer> 
		</div>
		<div class="col-sm-12" id="docket-observation-six"></div>
		<div id="docket-step-six" class="single-step"> 
			<span class="connectorarrow-tm"></span>
			<p>The payment of the Upfront Price must occur on or before the agreed Deadline.</p>
			<footer>
				<a href="#" class="btn-default pull-right" data-powertour-action="stop" onclick="cancelDocketTour();">End</a>
				<a href="#" class="tour-button" data-powertour-action="prev">Prev</a>
				<a href="#" class="mrg15L tour-button" data-powertour-action="next">Next</a>
			</footer> 
		</div>
		<div class="col-sm-12" id="docket-observation-two"></div>
		<div id="docket-step-two" class="single-step"> 
			<span class="connectorarrow-tm"></span>
			<p>To fund the Upfront Price, you and representatives of other technology companies were invited to participate in this ad-hoc crowdfunding syndicate, which will split the Upfront Price equally among its participants.</p>
			<footer>
				<a href="#" class="btn-default pull-right" data-powertour-action="stop" onclick="cancelDocketTour();">End</a>
				<a href="#" class="tour-button" data-powertour-action="prev">Prev</a>
				<a href="#" class="mrg15L tour-button" data-powertour-action="next">Next</a>
			</footer> 
		</div>
		<div class="col-sm-12" id="docket-observation-three"></div>
		<div id="docket-step-three" class="single-step"> 
			<span class="connectorarrow-tm"></span>
			<p>Interested companies send us their requests to participate in which they indicate the maximum amount they are willing to contribute. The arrival time and committed amount of each request will be shown as red dots on the chart. (the green dots and all other information in green are for illustration only).</p>
			<footer>
				<a href="#" class="btn-default pull-right" data-powertour-action="stop" onclick="cancelDocketTour();">End</a>
				<a href="#" class="tour-button" data-powertour-action="prev">Prev</a>
				<a href="#" class="mrg15L tour-button" data-powertour-action="next">Next</a>
			</footer> 
		</div>
		<div class="col-sm-12" id="docket-observation-four"></div>
		<div id="docket-step-four" class="single-step"> 
			<span class="connectorarrow-tm"></span>
			<p>A successful closing occurs as soon as the smallest subset of commitments allows an equal share of the Upfront Price. The Purchase Price will then be divided equally among the members of that subset.</p>
			<footer>
				<a href="#" class="btn-default pull-right" data-powertour-action="stop" onclick="cancelDocketTour();">End</a>
				<a href="#" class="tour-button" data-powertour-action="prev">Prev</a>
				<a href="#" class="mrg15L tour-button" data-powertour-action="next">Next</a>
			</footer> 
		</div>
		<div class="col-sm-12" id="docket-observation-five"></div>
		<div id="docket-step-five" class="single-step"> 
			<span class="connectorarrow-tm"></span>
			<p>Companies that don't make it into the funding group will be able to buy licenses and enforcement rights at the Regular Price (1.5 x Participants' Price) and after 4 months at the Validated Price (3 x Participants' Price), subject to inventory availability.</p>
			<footer>
				<a href="#" class="btn-default pull-right" data-powertour-action="stop" onclick="cancelDocketTour();">End</a>
				<a href="#" class="tour-button" data-powertour-action="prev">Prev</a>
			</footer> 
		</div>
		<div class="col-sm-12" id="docket-observation-seven"></div>
		<div id="docket-step-seven" class="single-step"> 
			<p>As a participant, you'll be entitled to get a non-exclusive license, and enforcement rights against one or more designated third-party of your choice, each at a price equal to the Participants' Price at Closing. In addition, all participants will share ⅓ of SynPat's income from future sales of non-exclusive licenses and enforcement rights under this portfolio.</p>
			<footer>
				<a href="#" class="btn-default pull-right" data-powertour-action="stop" onclick="cancelDocketTour();">End</a>
				<a href="#" class="tour-button" data-powertour-action="prev">Prev</a>
				<a href="#" class="mrg15L tour-button" data-powertour-action="next">Next</a>
			</footer> 
		</div>
	</script>

	function generateToken(callBack,t,ID) {
		var getTokenFromLocal = localStorage.getItem("synpat_shop");
	    if(getTokenFromLocal == "" || getTokenFromLocal == null || typeof getTokenFromLocal == "undefined"){
			const params = {
				key:'1ee9247397c05d94cbf0e283b95460a1b90ddfd4'
			}
			const $params = $.param(params);
			axios.post(baseUrl+'auth',$params)
			.then(function(response) {
				if(response.data.message == "Authenticated!") {
					tokenStr = response.data.data.token;
					localStorage.setItem("synpat_shop", tokenStr);
					if(typeof callBack === 'function') {
						callBack.apply(this,[t,ID]);
					}				
				}			
			})
			.catch(function (error) {
				console.log("Error:"+error);
			});
		} else {
			tokenStr = getTokenFromLocal;
			if(typeof callBack === 'function') {
				callBack.apply(this,[t,ID]);
			}
		}		
	}		
	
	function getTokenHeader(){
		if(cancelT.length > 0) {

						c();
					}
				});
			}catch(e){
				cancelT = [];
				console.log("Invalid cancel token:"+e);
			}			
		}
		if(typeof tokenStr == "undefined" || tokenStr == null || tokenStr == "undefined") {
			generateToken(getTokenHeader);
		} 
		return  {headers: {"Authorization" : tokenStr}};
	}
	
	let getCategoryList = function(t,parentID,c,inv) {
		// Get the list of categories and t defined call parent categories or sub categories from parent ID.
		
		const currentLocation = window.location;
		let invitationNumber;
		if(currentLocation.search != "") {
			if(currentLocation.search.indexOf('show&c') >= 0) {
				let searchN = currentLocation.search.split('&');
				if(searchN.length == 2) {
					if(searchN[1] != "" && searchN[1].indexOf('=') >= 0) {
						searchN = searchN[1].split('=');
						if(searchN.length == 2) {
							if(searchN[0] == "c" && searchN[1] != "") {
								invitationNumber = searchN[1];
							}
						}
					}
				}
			} else {
				invitationNumber = currentLocation.search;
				invitationNumber = invitationNumber.replace("?","");
			}			
		}
		let apiURL = baseUrl+'category';
		
		if(t == 1 && parentID > 0) {
			apiURL = baseUrl+'category/'+parentID;
		} 
		
		let token = "";
		let checkT = true;
		if(getLoggedTokenValue() != null && getLoggedTokenValue() != 'undefined'){
			token = getLoggedInToken();
		}
		if(token == "" && (typeof parentID == undefined || parentID == 0)){
			token = getTokenHeader();
		}
		axios.get(apiURL,token)
		.then(function(response) {
			let appendElement = document.getElementById('sidebar_list');
			if(t == 1 && parentID > 0) {
				let parentLI = document.getElementById('cat-'+parentID);
				if(parentLI.className.indexOf('is-active')<0){
					parentLI.className  += " is-opened is-active";
				}					
				appendElement = parentLI.querySelector('ul');
				appendElement.style.display = "block";
			}
			if(typeof response.data.data !='undefined' && response.data.data.length>0) {
				/* Category list */
				const categoryList = response.data.data;
				let categoryTemplate = document.getElementById("category-template").innerHTML;
				if(t == 1 && parentID > 0) {
					categoryTemplate = document.getElementById("child-category-template").innerHTML;
				}
				let handlerBarTemplate = Handlebars.compile(categoryTemplate);
				const categoryHTML =  handlerBarTemplate(categoryList);
				appendElement.innerHTML = categoryHTML;
				if(t == 0) {
					getCategoryList(1,categoryList[0].id);
				}
				if(domImplementEvents === false) {
					domImplementEvents = true;
					addEventListnersOnDom();
				}
				
				if(invitationNumber != "") {					
					if(typeof c == "undefined") {
						getPortfolioList(0,0,invitationNumber);	
					}
				}else {
					/*Call demo list*/
					if(typeof c == "undefined") {
						getPortfolioList(1,0,0);
					}					
				}		
			} else if(typeof response.data.error_code!="undefined") {
				if(typeof inv == "undefined") {
					alert(response.data.message);
				}
			}
		})
		.catch(function (error) {
			console.log("Error:"+error);
		});
	};
	
	function getPortfolioList(t,category,invitationNumber) {
		// sending request for the portfolio and t defines whether we have to bring real portfolio or demo portfolio.
		let apiURL = baseUrl+'portfolio/'+category;
		
		if(typeof invitationNumber != "undefined") {
			apiURL += '/'+invitationNumber;
		}
		
		if(t == 1) {
			apiURL = baseUrl+'demo_portfolio';
		}
		let token = getTokenHeader();
		let checkT = true;
		if((invitationNumber == "" || invitationNumber == null || typeof invitationNumber == "undefined") && (getLoggedTokenValue() == "" || getLoggedTokenValue() == null)){
			alert("Please login first.");
			openSignin();
			checkT = false;
		} else if(invitationNumber != "" && (getLoggedTokenValue() == "" || getLoggedTokenValue() == null)) {
			token = getTokenHeader();
		} else if(getLoggedTokenValue() != "" && getLoggedTokenValue() != null && validateLToken()) {
			token = getLoggedInToken();
		}
		
		if(checkT === true){
			axios.get(apiURL,token)
			.then(function(response) {
				if(typeof response.data != "" && typeof response.data.data != "undefined" && typeof response.data.data.portfolio_list != "undefined"){
					loadPortfolioList(response.data.data.portfolio_list);
					if(invitationNumber != '' && response.data.data.portfolio_cat_list.length > 0){
						if(response.data.data.portfolio_list[0].invitation === true) {
							setTimeout(()=>{
								let parentID = response.data.data.portfolio_list[0].category;
								let parentLI = document.getElementById('cat-'+parentID);
								if(parentLI.className.indexOf('is-active')<0){
									parentLI.className  += " is-opened is-active";
								}					
								let appendElement = document.getElementById('sidebar_list');
								appendElement = parentLI.querySelector('ul');
								appendElement.style.display = "block";
								categoryTemplate = document.getElementById("child-category-template").innerHTML;
								let handlerBarTemplate = Handlebars.compile(categoryTemplate);
								const categoryHTML =  handlerBarTemplate(response.data.data.portfolio_cat_list);
								appendElement.innerHTML = categoryHTML;
								checkParent(parentID);
							},2000);
						}						
					}
				} 			
			})
			.catch(function (error) {
				console.log("Error:"+error);
			});
		}		
	}
	
	function checkParent(p){
		setTimeout(()=>{
			let parentLI = document.getElementById('cat-'+p);

				if(parentLI.querySelector('ul.synpat-store-sidebar-list-sub') != null && parentLI.querySelector('ul.synpat-store-sidebar-list-sub').querySelectorAll('li').length > 0){

					}
				} else {
					checkParent(p)
				}				
			} else {
				checkParent(p)
			}
		},500);
	}

	function loadAllImagesExceptGif(t){
	/*console.log("Images");*/
	loadImageAll = 0;imagesLength = 0;
		const lazyImagesElement = document.querySelectorAll('.lazyImage');		
		if(lazyImagesElement.length > 0){
			let imgElement,imgSrc;
			for(i=0;i<lazyImagesElement.length;i++){
				imgElement = lazyImagesElement[i];
				imgSrc = imgElement.getAttribute('data-src');
				if(imgSrc != null){
					if(t == 0 && imgSrc.toLowerCase().indexOf('.gif') < 0){
						imagesLength++;
						imgElement.setAttribute("src",imgSrc)
						imgElement.style.display="block";
						imgElement.removeAttribute("data-src");					
						waitForImageToLoad(imgElement,t);
					} else if(t == 1 && imgSrc.toLowerCase().indexOf('.gif') >= 0){
						imagesLength++;
						imgElement.setAttribute("src",imgSrc)
						imgElement.style.display="block";
						imgElement.removeAttribute("data-src");					
						waitForImageToLoad(imgElement,t);
					}
				}else {/*console.log("Item",i);*/}				
			}
		}
	}
	
	function waitForImageToLoad(imageElement,t){
		let prom = new Promise((resolve,reject) => {
			imageElement.onload = () => {
				loadImageAll++;
				if(imagesLength == loadImageAll){
					if(t == 0){
						loadGifImages();
					} else {
						loadVideos();
					}
				}
				resolve(true);
			}		
		});
	}

	function callValidityPagination(ID,currentPage,t,j) {
		let filesListClass = "";
		if(t === 1) {
			filesListClass =  "TD_FILES";
		} else if(t === 2) {
			filesListClass =  "CD_FILES";
		}
		if(filesListClass != "") {
			const list_files =  $('#'+ID).find('.'+filesListClass).find('.blade-pagination');
			const spanL = list_files.find('li.file').length;
			list_files.find('li.page').attr('data-total',spanL);
			const showRecordPerPage = 3;
			/*console.log(spanL);*/
			if(spanL > showRecordPerPage) {
				let start = 1;
				if(currentPage > 1) {
					start = (currentPage-1) * showRecordPerPage;
				}
				const upto = currentPage * showRecordPerPage;
				let showFirst = false;		
				
				list_files.find('li.file').each(function(i,s){
					showFirst = false;
					if(start == 1 && i == 0) {
						showFirst = true;
					}
					if((i >= start &&  i < upto) || showFirst === true) {
						list_files.find('li.file').eq(i).show();
					} else {
						list_files.find('li.file').eq(i).hide();
					}
				});
				const pages = Math.ceil(spanL / showRecordPerPage);
				const showPageList = 2;
				if(pages > 1) {
					let listElement = "";
					let showNextMore = false;
					let showPrevMore = false;
					let showPageUpto = currentPage + showPageList;
					if(showPageUpto < pages) {
						showNextMore = true;
					} else {
						showPageUpto = pages;
					}
					let classActive = "";
					let disableFirst = "disabled";
					let disablePrev = "disabled";
					let previousPage = 1;
					if(currentPage > 1) {
						disableFirst = "";
						disablePrev = "";
						previousPage = currentPage - 1;
						showPrevMore = true
					}
					if(showPrevMore === true) {
						list_files.find('li.prev').attr('data-page',(currentPage-1)).show();
					} else {
						list_files.find('li.prev').hide();
					}
					if(currentPage < pages) {
						list_files.find('li.next').attr('data-page',(currentPage+1)).show();
					} else {

	function showThisPage(o) {		
		if(!o.hasClass('disabled')) {
			let typeF = 0;
			if(o.hasClass('1')) {
				typeF = 1;
			} else if(o.hasClass('2')) {
				typeF = 2;
			}
			if(typeF > 0) {
				const parentID = o.parents('div.otherValidations').attr("id");
				let j = 0;
				if(o.hasClass('file')) {
					openExecutedFile(o);
					j = 1;
					$('.TD_FILES,.CD_FILES').find('.blade-pagination').find('li.file').removeClass('active');
					o.addClass('active');
				}				
				if(o.hasClass('next') || o.hasClass('prev')) {
					const nextPage = o.attr('data-page');
					
					callValidityPagination(parentID,parseInt(nextPage),typeF,j);
				}				
			}
		}
	}

		setTimeout(()=>{

				const PGD_FILLED_Postion =  $('#'+ID).find('.PGD_FILLED').position();

				try{
					let topPTA;

					$('#'+ID).find('.PTA').css({marginTop:topPTA+'px'});
					/*$('#'+ID).find('.PGD_FILLED').css({top:topPGD+'px',position:'absolute',left:'0px'});*/

	function sortByKey(array, key) {
		return array.sort(function(a, b) {
			var x = a[key]; var y = b[key];
			return ((x < y) ? -1 : ((x > y) ? 1 : 0));
		});
	}

	function callImagesListOneByOne(tbl,staticString,t) {

											}

												_tRow.html(_string);

										}
									} else {

									}
								} else {
									notDone++;
								}

							}
						} else {

	const timeFormat = 'MM/DD/YYYY HH:mm';
	const dateFormat = 'MMM DD';
	
	function newDate(date) {
		return moment(new Date(date)).format(dateFormat);
	}

	function newDateString(date) {
		return moment(new Date(date)).format(timeFormat);
	}
	
	function getDataObject(date) {
		const dateString = new Date(date);
		const Year = dateString.getFullYear();
		const Month = dateString.getMonth();
		const Day = dateString.getDate();
		const Hours = dateString.getHours();
		const Minutes = dateString.getMinutes();
		const Seconds = dateString.getSeconds();
		const Milliseconds = dateString.getMilliseconds();
		return {Year:Year,Month:Month,Day:Day,Hours:Hours,Minutes:Minutes,Seconds:Seconds,Milliseconds:Milliseconds};
	}
	
	function getPreviousValue(r,j,t){
		let v = null;
		for(let s = j-1;s>=0;s--){
			if(t == 1){
				if(r[s].value != null){
					v = r[s].value;
					return v;
				}
			}
		}
		return v;
	}

	function cleanComponent() {
		let promise = new Promise((resolve, reject) => {
			const getComponentList = document.getElementsByClassName('component');
			if(getComponentList.length>0){
				for(let i=0;i<getComponentList.length;i++){
					getComponentList[i].innerHTML = "";
					getComponentList[i].className.replace(/\bcomp_active\b/g, "");
					try{
						getComponentList[i].classList.remove("comp_active");
					}catch(e){
						
					}
				}
				$("#slider_container").find('div.image_holder').remove();
			}
			resolve("Portfolio Tab template load");			
		});
		return promise;
	}

	function dragScrollTable(){
		(function (root, factory) {
			if (typeof define === 'function' && define.amd) {
				define(['exports'], factory);
			} else if (typeof exports !== 'undefined') {
				factory(exports);
			} else {
				factory((root.dragscroll = {}));
			}
		}(this, function (exports) {
			var _window = window;
			var _document = document;
			var mousemove = 'mousemove';
			var mouseup = 'mouseup';
			var mousedown = 'mousedown';
			var EventListener = 'EventListener';
			var addEventListener = 'add'+EventListener;
			var removeEventListener = 'remove'+EventListener;
			var newScrollX, newScrollY;

			var dragged = [];
			var reset = function(i, el) {
				for (i = 0; i < dragged.length;) {
					el = dragged[i++];
					el = el.container || el;
					el[removeEventListener](mousedown, el.md, 0);
					_window[removeEventListener](mouseup, el.mu, 0);
					_window[removeEventListener](mousemove, el.mm, 0);
				}

				// cloning into array since HTMLCollection is updated dynamically
				dragged = [].slice.call(_document.getElementsByClassName('dragscroll'));
				for (i = 0; i < dragged.length;) {
					(function(el, lastClientX, lastClientY, pushed, scroller, cont){
						(cont = el.container || el)[addEventListener](
							mousedown,
							cont.md = function(e) {
								if (!el.hasAttribute('nochilddrag') ||
									_document.elementFromPoint(
										e.pageX, e.pageY
									) == cont
								) {
									pushed = 1;
									lastClientX = e.clientX;
									lastClientY = e.clientY;

									e.preventDefault();
								}
							}, 0
						);

						_window[addEventListener](
							mouseup, cont.mu = function() {pushed = 0;}, 0
						);

						_window[addEventListener](
							mousemove,
							cont.mm = function(e) {
								if (pushed) {
									(scroller = el.scroller||el).scrollLeft -=
										newScrollX = (- lastClientX + (lastClientX=e.clientX));
									scroller.scrollTop -=
										newScrollY = (- lastClientY + (lastClientY=e.clientY));
									if (el == _document.body) {
										(scroller = _document.documentElement).scrollLeft -= newScrollX;
										scroller.scrollTop -= newScrollY;
									}
								}
							}, 0
						);
					 })(dragged[i++]);
				}
			}

			  
			if (_document.readyState == 'complete') {
				reset();
				/*console.log("1q");*/
			} else {
				_window[addEventListener]('load', reset, 0);
				/*console.log("2q");*/
			}

			exports.reset = reset;
		}));
	}

	function sortPortfolioList() {
		const portfolio_sorting = document.getElementById('portfolio_sorting').value;
		const portfolioListElement = document.getElementById('portfolios_list');
		const portList = portfolioListElement.querySelectorAll('li.synpat-store-content-list-item');
		let fieldName = "";
		let fieldOrder = "";
		switch(portfolio_sorting) {
			case 'l_h':
				fieldName = "data-price";
				fieldOrder = "ASC";
				break;
			case 'h_l':
				fieldName = "data-price";
				fieldOrder = "DESC";
				break;
			case 'e_l':
				fieldName = "data-date";
				fieldOrder = "ASC";
				break;
			case 'l_e':
				fieldName = "data-date";
				fieldOrder = "DESC";
				break;
		}
		let portListArray = [];
		if(portList.length > 0) {
			let attributeValue = "";
			for(let i = 0; i < portList.length; i++) {
				attributeValue = portList[i].getAttribute(fieldName);
				if(fieldName == "data-date") {
					attributeValue = new Date(attributeValue);
					attributeValue = attributeValue.getTime();
				} else if(fieldName == "data-price") {
					attributeValue = attributeValue.replace("$","");
					attributeValue = attributeValue.replace("M","");
					attributeValue = parseFloat(attributeValue);
				}
				portListArray.push({serial:portList[i].getAttribute("data-serial"),attr:attributeValue});
			}
			if(fieldName === "data-price") {
				portListArray.sort(function(a, b){
					return parseFloat(a.attr) - parseFloat(b.attr);
				});			
			}else if(fieldName === "data-date") {
				portListArray.sort(function(a, b){
					return parseInt(a.attr) - parseInt(b.attr);
				});			
			}
			if(fieldOrder === "DESC")  {
				portListArray = portListArray.reverse();
			}
			portListArray.forEach(function(p,i){
				portfolioListElement.appendChild(portfolioListElement.querySelector('li[data-serial="'+p.serial+'"]'));
			})
		}
	}

	function getPatentNumberWithoutCode(patentNumber) {
		if(patentNumber) {
			switch(patentNumber.length){
				case 9:
					patentNumber = patentNumber.substr(2);
				break;
				case 10:
					patentNumber = patentNumber.substr(2);
					patentNumber = patentNumber.substr(0,patentNumber.length-1);
				break;
				case 11:
				case 13:
					patentNumber = patentNumber.substr(2);
					patentNumber = patentNumber.substr(0,patentNumber.length-2);
				break;
				default:
					patentNumber = patentNumber;
				break;
			}
		}
		return patentNumber;
	}

				let formSerialize;
				if(serialize == 0) {
					/*console.log(formObject.serialize());*/

				} else {
					/*console.log(formObject);*/

	function validateLoginDetail() {
		let error = 0;
		let errorMessages = "";		
		let _checkWhichOpen = 0;
		if($("#userEmailAddress1").val()==""){
			error = 1;
			errorMessages+="Please enter email address.\n";
		} else {
			_checkWhichOpen = 1;
		}
		if($("#userPassword1").val()==""){
			error = 1;
			errorMessages+="Please enter password.\n";
		} else {
			_checkWhichOpen = 1;
		}
		if(_checkWhichOpen == 0 && error == 1){
			if($("#registerPersonName").val() != "" || jQuery.trim($("#registerPersonName").val()) != "" || $("#registerCompanyName").val() != "" || $("#registerPersonEmail").val() != ""  || $("#registerPersonPhone").val() != "" || $("#registerPassword1").val() != "" || $("#registerConfirmPassword1").val() != "" || ($("#registerConfirmPassword1").val() != $("#registerPassword1").val())){
				_checkWhichOpen = 0,error = 0,errorMessages="";
			}
		}
		if(_checkWhichOpen == 0 && error == 0){
			if($("#registerPersonName1").val()=="" && jQuery.trim($("#registerPersonName1").val()) == ""){
				error = 1;
				errorMessages += "Please enter name.\n";
			} else {
				_checkWhichOpen = 1;
			}	
			if($("#registerCompanyName1").val()==""){
				error = 1;
				errorMessages += "Please enter company name.\n";										
			} else {
				_checkWhichOpen = 1;
			}			
			if($("#registerPersonEmail1").val()==""){
				error = 1;
				errorMessages += "Please enter email address.\n";								
			} else {
				_checkWhichOpen = 1;
			}
			var pattern = /^[0-9\s]*$/;
			if($("#registerPersonPhone1").val()==""){
				error = 1;
				errorMessages += "Please enter the best telephone number at which you can be accessed.\n";
			} else if(pattern.test($("#registerPersonPhone1").val()) === false && $("#registerPersonPhone1").val().length >=10){
				error = 1;
				errorMessages += "Please enter the best telephone number at which you can be accessed. Allowed space and numbers.\n";
			} else {
				_checkWhichOpen = 1;
			}
			if($("#registerPassword1").val()==""){
				error = 1;
				errorMessages +="Please enter password.\n";							
			} else {
				_checkWhichOpen = 1;
			}
			if($("#registerConfirmPassword1").val()==""){
				error = 1;
				errorMessages +="Please enter confirm password.\n";							
			} else {
				_checkWhichOpen = 1;
				/*console.log("OpenG:");*/
			}
			if($("#registerPassword1").val()!=$("#registerConfirmPassword1").val() && $("#registerPassword1").val()!="" && $("#registerConfirmPassword1").val()!=""){
				error = 1;
				errorMessages+="Password doesn't not match.\n";
			} else {
				_checkWhichOpen = 1;
			}
		}
			
		if(_checkWhichOpen==0){			
			error = 1;
			errorMessages ="Please enter details in registered customer or new customer.\n";
		}
		return {error:error,message:errorMessages,checkOpen:_checkWhichOpen};
	}

			let apiURL = baseUrl+"login";
			const params = {

				password:loginPassword

			const $params = $.param(params);
			axios.post(apiURL,$params,getTokenHeader())

						} else {
							alert("Invalid email and password.");
						}
					} else {
						alert("Invalid email and password.");
					}
				} else {
					alert("Invalid email and password.");
				}
			})
			.catch(function (error) {
				console.log("Error:"+error);
			});
		}
	}

	function preferenceDomClick() {
		$('.synpat-store-sidebar-list-item-toggler').off('click').on('click', function() {
			const $this = $(this),
				$li = $this.parent(),
				$sublist = $li.find('.synpat-store-sidebar-list-sub'),
				$openedSublists = $('.synpat-store-sidebar-list-sub:visible');

			if(!$sublist.is(':visible') && $openedSublists.length) {				
				$openedSublists.slideUp('100', function() {
					$openedSublists.parent().removeClass('is-opened');
				});
			}
			if($sublist.length) {
				if($li.find('input.main-checkbox').is(':checked')){
					if($li.find('ul.synpat-store-sidebar-list-sub').find('input:checked').length == 0) {
						$li.find('ul.synpat-store-sidebar-list-sub').find('input').prop("checked", true);
					}
				}
				$sublist.slideToggle('100', function() {
					$li.toggleClass('is-opened');
				});
			}

			return false;
		});


		$('.synpat-store-sidebar-list-item input[type=checkbox]').on('change', function() {
			const $cthis = $(this);
			const $innerCheckboxes = $cthis.parent().parent().parent().find('.synpat-store-sidebar-list-sub input[type=checkbox]');
			if($cthis.prop('checked')) {
				$innerCheckboxes.each(function(index, checkbox) {
					$(checkbox).prop('checked', true);
				});
			}
			else {
				$innerCheckboxes.each(function(index, checkbox) {
					$(checkbox).prop('checked', false);
				});
			}
		});


		$('.synpat-store-sidebar-list-sub-item input[type=checkbox]').on('change', function() {
			const $parentCheckbox = $(this).parent().parent().parent().parent().parent().find('.main-checkbox');

			if(!$(this).prop('checked')) {
				$parentCheckbox.prop('checked', false);
			}
		});
	}

		.then((response) => {
			o.text("Save");
			let message = "";
			if(response != null && response.data != null && response.data.data != null) {
				if(typeof response.data.data.error_code == "undefined") {
					if(typeof response.data.data.successPersonalInfo != "undefined" && response.data.data.successPersonalInfo!= "") {
						message += response.data.data.successPersonalInfo;
					}
					if(typeof response.data.data.successCompanyInfo != "undefined" && response.data.data.successCompanyInfo!= "") {
						message += "\n"+response.data.data.successCompanyInfo;
					}
					if(typeof response.data.data.errorPersonalInfo != "undefined" && response.data.data.errorPersonalInfo!= "") {
						message += "\n"+response.data.data.errorPersonalInfo;
					}
					if(typeof response.data.data.errorCompanyInfo != "undefined" && response.data.data.errorCompanyInfo!= "") {
						message += "\n"+response.data.data.errorCompanyInfo;
					}
					if(typeof response.data.data.errorUser != "undefined" && response.data.data.errorUser.length > 0) {
						message += "\n Error while adding these users\n";
						response.data.data.errorUser.forEach(function(f){
							message += f+"\n ";
						});
					}
					if(typeof response.data.data.successUser != "undefined" && response.data.data.successUser.length > 0) {
						message += "\n List of users added successfully\n";
						response.data.data.successUser.forEach(function(f){
							message += f+"\n ";
						});
					}
				} else {
					if(typeof response.data.data.message == "undefined") {
						message += "Error while updating your account. Please try after sometime.";	
					} else {
						message += response.data.data.message;	
					}
				}
			} else {
				message += "Error while updating your account. Please try after sometime.";	
			}
			alert(message);
			callUsersList();
		})
		.catch((error) => {
			console.log("Error:"+error);
		});
	}

	function checkBodyOverflow() {

			let widthM = $('#nav .menuArea').attr("data-width");
			/*console.log("TOP:",$("#menuTabPortfolio").offset().top,widthM);*/

				if(widthM == "undefined" || widthM == "NaN"){
					widthM = 100;
				} else {
					widthM = parseInt(widthM);

					widthM = 101;
					ts = false;

					jQuery("#portfolio_bar").css("width","285px");

			} else {
				/*console.log("MM12");*/
				$('#nav .menuArea').attr("data-width",100).css("width",100+"%");
			}		
			lastW = cWindow;
			if(checkWInterval !== undefined) {
				clearInterval(checkWInterval);
			}
			if(ts === true) {
				checkWInterval = setInterval(checkBodyOverflow,50);
			}				
		} else {

				.then((response,reject) => {
					if(response == true) {
						goToShop();
					}
				})
				.catch((error) => {
					window.location = "https://synpat.com/store";
				});
			}				
		}
		/*openUrl('_zfr5alwz5u4e5vrYcme5OwL8i8qK6X22Wr2uVc70fM');*/
		$(window).bind("beforeunload",function(event) {
			return "";
		});
		searchKeyPressEvent();
		closeSliderOutsideClick();
		if($("#fontAwesomeCC").length == 0){
			loadJsFiles("MomentJS",templateUrl+"assets/js/moment.min.js");
			setTimeout(()=>{				
				loadJsFiles("jQueryUIMinJS",templateUrl+"assets/js/jquery-ui.min.js");
				loadCssFiles("jQueryUIMinCSS",templateUrl+"assets/css/jquery-ui.min.css");
				loadCssFiles("fontAwesomeCSS","//maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css");
				loadJsFiles("pusher","//js.pusher.com/2.2/pusher.min.js",loadPushNotfication);
			},5000);
		}
	});
	
	function loadPushNotfication(){
		if(typeof Pusher != "undefined"){
			var pusher = new Pusher('da3c868ed032063affa0',{
			  cluster: "mt1"
			});
			var notificationsChannel = pusher.subscribe('notifications');
			notificationsChannel.bind('new_notification', function(notification){
				var message = notification.message;
				try{
					_check = JSON.parse(message);
					switch(_check.action){
						case 'store':
							const pushStoreData = JSON.parse(_check.message);
							let activeComponent = $("#shop_component");
							if(activeComponent.hasClass('comp_active')){
								const portolioListEle = $("#portfolios_list");
								if(portolioListEle.length > 0){
									const findListElement = portolioListEle.find('li[data-serial="'+pushStoreData.portfolio_number+'"]');
									if(findListElement.length > 0){
										const itemPriceList = findListElement.find('.synpat-store-content-list-item-price');
										if(itemPriceList.length > 0){
											itemPriceList.eq(itemPriceList.length-1).find('.synpat-store-content-list-item-price-value').html(pushStoreData.option_expiration_data);
											itemPriceList.eq(itemPriceList.length-2).find('.synpat-store-content-list-item-price-value').html(pushStoreData.final_participants);
											itemPriceList.eq(itemPriceList.length-3).find('.synpat-store-content-list-item-price-value').html(pushStoreData.potential_participants);
											itemPriceList.eq(itemPriceList.length-4).find('.synpat-store-content-list-item-price-value').html(pushStoreData.seller_asking_price);
											itemPriceList.eq(0).find('.synpat-store-content-list-item-price-value').html(pushStoreData.participant_price);
											itemPriceList.eq(0).removeClass('is-validated').removeClass('is-regular');
											if(pushStoreData.participate == true){
												itemPriceList.eq(0).find('.synpat-store-content-list-item-price-key').text('Pending Cost Price');
												itemPriceList.eq(0).addClass('is-regular');
											}else if(pushStoreData.regular == true){
												itemPriceList.eq(1).find('.synpat-store-content-list-item-price-value').html(pushStoreData.regular_price);
												itemPriceList.eq(1).removeClass('is-validated').addClass('is-regular');												
											}else if(pushStoreData.validate == true){
												itemPriceList.eq(1).find('.synpat-store-content-list-item-price-value').html(pushStoreData.validate_price);
												itemPriceList.eq(1).removeClass('is-validated').addClass('is-regular');												
											}
										}
									}
								}
							} else {
								activeComponent = $("#store_component");
								if(activeComponent.hasClass('comp_active')){
									let storeSerial = activeComponent.find("#portfolio_bar").find('.serial').text();
										storeSerial = storeSerial.replace("S/N: ","");
									if(storeSerial != "" && parseInt(storeSerial) == pushStoreData.portfolio_number){
										const box1 = $("#porfolio_box_1");
										/*box1.find('.folioTable').find('tr').eq(2).find('td span.request').text(pushStoreData.potential_participants);*/
										if(pushStoreData.participate == true){
											box1.find('.folioTable').find('tr').eq(2).find('td').eq(1).find('span').text(pushStoreData.participant_price);
										}
										box1.find("#expiration_date").val(pushStoreData.option_expiration_data);
										box1.find('.folioTable').find('tr').eq(1).find('td').eq(1).find('span').text(pushStoreData.seller_asking_price);
										const box2 = $("#porfolio_box_2");
										portfolioData.commitments = pushStoreData.commitments;
										const chartBox = box2.find("#commitment_chart");
										chartBox.empty();
										portfolioLoadAccordionBoxTwo();											
									}									
								}
							}
							break;
					}
				}catch(e){
					console.log("Error push",e);
				}
			});
		} else {
			setTimeout(()=>{loadPushNotfication()},1000);
		}		
	}
	function checkSafariBrowser(){
		const ua = navigator.userAgent.toLowerCase(); 
		let isSafari = false;
		try {
		  isSafari = /constructor/i.test(window.HTMLElement) || (function (p) { return p.toString() === "[object SafariRemoteNotification]"; })(!window['safari'] || safari.pushNotification);
		}
		catch(err) {}
		isSafari = (isSafari || ((ua.indexOf('safari') != -1)&& (!(ua.indexOf('chrome')!= -1) && (ua.indexOf('version/')!= -1))));
		/*isSafari = window.safari !== undefined;*/
		return isSafari;
	}	
	</script>
